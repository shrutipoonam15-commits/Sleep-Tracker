<!DOCTYPE html>
<html>

<head>
    <title>SleepTracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🌙 Sleep Tracker😴</h1>
   
    <label for="participantID">Anonymous Participant ID</label>
<input type="text" id="participantID" placeholder="Example: A01">

    <div class="container">

        <label for="bedtime">Bedtime</label>
        <input type="time" id="bedtime">

        <label for="waketime">Wake Time</label>
        <input type="time" id="waketime">

        <label for="quality">Sleep Quality (1-10)</label>
        <input type="number" id="quality" min="1" max="10">
       
        <label for="outsideTime">Time Outside Yesterday (minutes)</label>
<input type="number" id="outsideTime" min="0">

<label for="entryDate">Date</label>
<input type="date" id="entryDate">

        <button onclick="calculateSleep()">
            Save Sleep
        </button>
       
        <button onclick="exportReport()">
    Export My Sleep Report
</button>
       
        <button onclick="resetData()">
    Reset Data
</button>

       
        <h2>Sleep Log:</h2>

<div id="sleepLog">
    No entries yet.
</div>


<h2>Sleep Tracker Weekly Report:</h2>

<p id="reportAverageSleep">
    Average Sleep:
</p>

<p id="reportAverageQuality">
    Average Sleep Quality:
</p>

<p id="reportBestNight">
    Best Sleep Night:
</p>

<p id="reportTotalNights">
    Total Nights Logged:
</p>
<p id="averageSleep">
    Average Sleep:
</p>

<p id="averageQuality">
    Average Quality:
</p>
        <p id="hoursSlept">
            Hours Slept:
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
