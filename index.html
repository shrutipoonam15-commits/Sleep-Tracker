<!DOCTYPE html>
<html>

<head>
    <title>Sleep Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>Sleep Tracker</h1>

    <p>
        Track your sleep habits and see patterns over time.
    </p>


    <h2>Enter Sleep Information</h2>


    <label>
        Participant ID:
    </label>
    <input type="text" id="participantID">
    <br><br>


    <label>
        Date:
    </label>
    <input type="date" id="entryDate">
    <br><br>


    <label>
        Bedtime:
    </label>
    <input type="time" id="bedtime">
    <br><br>


    <label>
        Wake Time:
    </label>
    <input type="time" id="waketime">
    <br><br>


    <label>
        Sleep Quality (1-5):
    </label>
    <input type="number" id="quality" min="1" max="5">
    <br><br>


    <label>
        Time Outside (minutes):
    </label>
    <input type="number" id="outsideTime">
    <br><br>



    <button onclick="calculateSleep()">
        Save Sleep
    </button>


    <h2 id="hoursSlept">
        Hours Slept:
    </h2>



    <h2>Sleep Log</h2>

    <div id="sleepLog"></div>



    <h2>Sleep Statistics</h2>


    <p id="averageSleep">
        Average Sleep:
    </p>


    <p id="averageQuality">
        Average Sleep Quality:
    </p>


    <p id="bestNight">
        Best Sleep Night:
    </p>


    <p id="totalNights">
        Total Nights Logged:
    </p>




    <h2>Data Options</h2>


    <button onclick="exportData()">
        Export Data
    </button>


    <button onclick="resetData()">
        Reset Data
    </button>



    <script src="script.js"></script>

</body>

</html>
